name: Quality Checks

on:
  workflow_call:
    inputs:
      gomod:
        type: string
        default: go.mod

jobs:
  go:
    name: Go Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: dir
        env:
          GOMOD: ${{ inputs.gomod }}
        run: echo "dir=$(dirname "$GOMOD")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.gomod }}
      - run: go mod download
        working-directory: ${{ steps.dir.outputs.dir }}
      - name: Build
        if: ${{ !cancelled() }}
        run: go build ./...
        working-directory: ${{ steps.dir.outputs.dir }}
      - name: Test
        if: ${{ !cancelled() }}
        run: go test -v ./...
        working-directory: ${{ steps.dir.outputs.dir }}
      - name: Generate
        if: ${{ !cancelled() }}
        run: |
          go generate ./...
          git diff --exit-code
        working-directory: ${{ steps.dir.outputs.dir }}
      - name: Tidy
        if: ${{ !cancelled() }}
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
        working-directory: ${{ steps.dir.outputs.dir }}
      - name: Lint
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ steps.dir.outputs.dir }}
