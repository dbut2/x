bundles:
  go-quality:
    files:
      - quality-go.yaml
      - renovate-generate.yaml
    checks:
      - Go Quality
  compose:
    files:
      - quality-docker.yaml
    checks:
      - Docker Compose
  automerge:
    files:
      - automerge.yaml
  publish:
    files:
      - publish.yaml

targets:
  dbut2/x:
    bundles:
      - automerge
      - go-quality
  dbut2/bolt:
    bundles:
      - go-quality
      - automerge
  dbut2/commuter:
    bundles:
      - go-quality
      - compose
      - automerge
  dbut2/float:
    bundles:
      - go-quality
      - compose
      - automerge
  dbut2/web-template:
    bundles:
      - go-quality
      - compose
      - automerge
      - publish
  dbut2/cordial:
    bundles:
      - go-quality
      - automerge
      - publish
    runs-on: self-hosted
  dbut2/coach:
    bundles:
      - automerge
    checks:
      - Docker Compose
      - Gen Gate
      - Go Gate
