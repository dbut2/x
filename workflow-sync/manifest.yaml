bundles:
  go-quality:
    files:
      - quality-go.yaml
    checks:
      - Go Quality
  compose:
    files:
      - quality-docker.yaml
    checks:
      - Docker Compose
  automerge:
    files:
      - automerge.yaml
  publish:
    files:
      - publish.yaml
  renovate-generate:
    files:
      - renovate-generate.yaml

targets:
  dbut2/bolt:
    bundles:
      - go-quality
      - automerge
  dbut2/butla:
    bundles:
      - go-quality
    remove:
      - quality.yaml
      - codeql-analysis.yml
  dbut2/coach:
    bundles:
      - go-quality
      - compose
      - automerge
    gomods:
      - go/go.mod
      - tools/go.mod
    checks:
      - Gen Gate
  dbut2/commuter:
    bundles:
      - go-quality
      - compose
      - automerge
      - publish
  dbut2/cordial:
    bundles:
      - go-quality
      - automerge
      - publish
    runs-on: self-hosted
  dbut2/example:
    bundles:
      - go-quality
    remove:
      - quality.yaml
  dbut2/float:
    bundles:
      - go-quality
      - compose
      - automerge
      - publish
  dbut2/nebula:
    bundles:
      - automerge
    checks:
      - Go Test
      - golangci-lint
    runs-on: self-hosted
    retries: 100
    branch: main
  dbut2/web-template:
    bundles:
      - go-quality
      - compose
      - automerge
      - publish
  dbut2/x:
    bundles:
      - automerge
      - go-quality
      - renovate-generate
