bundles:
  go-quality:
    - quality.yaml
  automerge:
    - automerge.yaml
  publish:
    - publish.yaml

defaults:
  checks:
    - Docker Compose
    - Go Quality

targets:
  dbut2/bolt:
    bundles:
      - automerge
  dbut2/commuter:
    bundles:
      - go-quality
      - automerge
  dbut2/float:
    bundles:
      - go-quality
      - automerge
  dbut2/web-template:
    bundles:
      - go-quality
      - automerge
      - publish
  dbut2/cordial:
    bundles:
      - go-quality
      - automerge
      - publish
    runs-on: self-hosted
    checks:
      - Go Quality
  dbut2/coach:
    bundles:
      - automerge
    checks:
      - Docker Compose
      - Gen Gate
      - Go Gate
