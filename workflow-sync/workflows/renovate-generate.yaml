name: Renovate Generate

on:
  pull_request:

jobs:
  generate:
    runs-on: [[ .RunsOn ]]
    if: github.actor == 'renovate[bot]'
    outputs:
      changed: ${{ steps.commit.outputs.changes_detected }}
    defaults:
      run:
        working-directory: [[ .GomodDir ]]
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_CLIENT_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: [[ .Gomod ]]

      - run: go generate ./...

      - id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: go generate
          commit_user_name: dylan-botler[bot]
          commit_user_email: 230545208+dylan-botler[bot]@users.noreply.github.com
          commit_author: dylan-botler[bot] <230545208+dylan-botler[bot]@users.noreply.github.com>

  automerge:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      checks: read
    uses: ./.github/workflows/automerge.yaml
    secrets: inherit
